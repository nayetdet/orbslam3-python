name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Python ${{ matrix.python-version }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - { runner: ubuntu-22.04, os: linux, target: x86_64, wheel-platform: manylinux_2_35_x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux, target: aarch64, wheel-platform: manylinux_2_35_aarch64 }
          - { runner: macos-15-intel, os: macos, target: x86_64, deployment-target: "13.0" }
          - { runner: macos-15, os: macos, target: arm64, deployment-target: "14.0" }
          - { runner: windows-2025, os: windows, target: x86_64 }
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment-target }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Linux dependencies and Pangolin
        if: matrix.platform.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libboost-serialization-dev \
            libeigen3-dev \
            libepoxy-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglu1-mesa-dev \
            liboctomap-dev \
            libopencv-dev \
            libpcl-dev \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev
          git clone --depth 1 --branch v0.9.2 https://github.com/stevenlovegrove/Pangolin.git "$RUNNER_TEMP/Pangolin"
          cmake -S "$RUNNER_TEMP/Pangolin" -B "$RUNNER_TEMP/Pangolin/build" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PANGOLIN_PYTHON=OFF \
            -DBUILD_PANGOLIN_FFMPEG=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pangolin"
          cmake --build "$RUNNER_TEMP/Pangolin/build" --parallel
          cmake --install "$RUNNER_TEMP/Pangolin/build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/pangolin" >> "$GITHUB_ENV"

      - name: Install macOS dependencies and Pangolin
        if: matrix.platform.os == 'macos'
        run: |
          brew install boost eigen glew libepoxy openssl
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 \
            https://github.com/opencv/opencv/archive/refs/tags/4.10.0.tar.gz \
            -o "$RUNNER_TEMP/opencv.tar.gz"
          mkdir "$RUNNER_TEMP/opencv-src"
          tar -xzf "$RUNNER_TEMP/opencv.tar.gz" -C "$RUNNER_TEMP/opencv-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/opencv-src" -B "$RUNNER_TEMP/opencv-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencv" \
            -DBUILD_LIST=core,imgproc,imgcodecs,features2d,calib3d,highgui,video,videoio \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/opencv-build" --parallel
          cmake --install "$RUNNER_TEMP/opencv-build"
          git clone --depth 1 --branch v0.9.2 https://github.com/stevenlovegrove/Pangolin.git "$RUNNER_TEMP/Pangolin"
          cmake -S "$RUNNER_TEMP/Pangolin" -B "$RUNNER_TEMP/Pangolin/build" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PANGOLIN_PYTHON=OFF \
            -DBUILD_PANGOLIN_FFMPEG=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pangolin"
          cmake --build "$RUNNER_TEMP/Pangolin/build" --parallel
          cmake --install "$RUNNER_TEMP/Pangolin/build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/opencv:$RUNNER_TEMP/pangolin:$(brew --prefix)" >> "$GITHUB_ENV"
          echo "OpenCV_DIR=$RUNNER_TEMP/opencv/lib/cmake/opencv4" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: vcpkg install boost-serialization eigen3 glew opencv4 pangolin openssl --triplet x64-windows

      - name: Configure MSVC build environment
        if: matrix.platform.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Linux wheel
        if: matrix.platform.os == 'linux'
        run: uv build --wheel

      - name: Build macOS wheel
        if: matrix.platform.os == 'macos'
        run: uv build --wheel --config-setting=cmake.define.ORB_SLAM3_DENSE_RECONSTRUCTION=OFF

      - name: Build Windows wheel
        if: matrix.platform.os == 'windows'
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: >-
          uv build --wheel
          --config-setting="cmake.define.CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          --config-setting=cmake.define.VCPKG_TARGET_TRIPLET=x64-windows
          --config-setting=cmake.define.ORB_SLAM3_DENSE_RECONSTRUCTION=OFF

      - name: Bundle Linux libraries
        if: matrix.platform.os == 'linux'
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/pangolin/lib
        run: |
          uv tool run --with 'patchelf>=0.14.5' auditwheel repair \
            --plat "${{ matrix.platform.wheel-platform }}" \
            --wheel-dir wheelhouse \
            dist/*.whl

      - name: Bundle macOS libraries
        if: matrix.platform.os == 'macos'
        run: uv tool run --with delocate delocate-wheel --wheel-dir wheelhouse dist/*.whl

      - name: Bundle Windows libraries
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: >-
          uv tool run --with delvewheel delvewheel repair
          --wheel-dir wheelhouse
          --add-path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          dist/*.whl

      - name: Verify wheel
        if: matrix.platform.os != 'windows'
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python numpy wheelhouse/*.whl
          .wheel-test/bin/python -c "import orbslam3; print(orbslam3.__version__)"

      - name: Verify Windows wheel
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/Scripts/python.exe numpy (Get-ChildItem wheelhouse/*.whl).FullName
          .wheel-test/Scripts/python.exe -c "import orbslam3; print(orbslam3.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.whl
