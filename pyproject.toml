[project]
name = "orbslam3"
version = "0.1.18"
description = "Python bindings for ORB-SLAM3 with dense reconstruction support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.25,<4"
wheel.install-dir = "orbslam3/python_wrapper"
wheel.packages = ["src/orbslam3"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
